name: 01-My workflow

on:
    push: 
        branches: ["main"]
    workflow_dispatch:
        
jobs:
      "echo-hello":
        runs-on: ubuntu-latest
        steps:
            - name: Say Hello
              run:  |
                    echo "Hello, World!"
                    exit 0
      "echo-goodbye":
        runs-on: ubuntu-latest
        steps:
            - name: Failed Step
              run: echo "I will fail"
            - name: Say goodbye
              run: echo "Goodbye!"



