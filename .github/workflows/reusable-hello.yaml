name: Reusable Hello

on:
  workflow_call:
    inputs:
      name:
        type: string
        required: false
        default: "World"
    outputs:
      greeting:
        description: "Greeting from composite action"
        value: ${{ jobs.hello.outputs.greeting }}

jobs:
  hello:
    runs-on: ubuntu-latest
    outputs:
      greeting: ${{ steps.say.outputs.greeting }}
    steps:
      - name: Call composite action
        id: say
        uses: mayankbansa0105/gh-study/.github/actions/hello@main
        with:
          name: ${{ inputs.name }}