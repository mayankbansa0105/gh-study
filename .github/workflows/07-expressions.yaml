name: 07 - Using Expressions.
run-name: ${{ inputs.debug && '07 - Using Expressions  DEBUG - ON'||' 07 - Using Expressions | DEBUG - OFF' }} 
on:
    workflow_dispatch:
        inputs:
            debug:
                type: boolean
                default: false
jobs:
    echo:
        runs-on: ubuntu-latest
        steps:
            - name: Print start-up data"
              if: inputs.debug == true
              run: |
                 echo ""Triggered by: ${{ github.event_name }}""
                 echo "Branch: ${{ github.ref }}"
                 echo "Commit SHA: ${{ github.sha }}"
                 echo "RUNNER: ${{ github.runner }}"
            - name: Print when triggered from main
              if: inputs.debug  == true && github.ref_name  == 'main'
              run: echo "I was triggered from main"
            - name: Greeting
              run: echo "Hello, world"
